    let currentIndex = 0;
    let wrongQuestions = new Set();
    let isAnswered = false;
    let currentShuffledOptions = [];

    function loadQuestion(index) {
        if (index < 0 || index >= rawData.length) return;
        currentIndex = index;
        isAnswered = false;
        
        const data = rawData[currentIndex];
        document.getElementById('current-index').innerText = `Câu ${data.id}/894`;
        document.getElementById('question-text').innerText = data.q;
        document.getElementById('explanation-box').style.display = 'none';
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        // Tạo và xáo trộn thứ tự các phương án để không bị học vẹt vị trí
        currentShuffledOptions = [
            { text: data.a, key: 'A' },
            { text: data.b, key: 'B' },
            { text: data.c, key: 'C' },
            { text: data.d, key: 'D' }
        ].sort(() => Math.random() - 0.5);

        currentShuffledOptions.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerText = `${opt.key}. ${opt.text}`;
            div.onclick = () => checkAnswer(div, opt.key, data.ans);
            container.appendChild(div);
        });
        
        document.getElementById('jump-input').value = ''; 
    }

    function checkAnswer(element, selected, correct) {
        if (isAnswered) return;
        isAnswered = true;

        const options = document.querySelectorAll('.option');
        if (selected === correct) {
            element.classList.add('correct');
        } else {
            element.classList.add('wrong');
            wrongQuestions.add(currentIndex);
            updateWrongList();
            
            // Highlight đáp án đúng để người dùng ghi nhớ tức thì
            options.forEach((optDiv, idx) => {
                if (currentShuffledOptions[idx].key === correct) {
                    optDiv.classList.add('correct');
                }
            });
        }

        // Hiện tài liệu tham khảo ngay lập tức
        document.getElementById('explanation-text').innerText = rawData[currentIndex].ref || "Xem tài liệu đính kèm trong file hướng dẫn.";
        document.getElementById('explanation-box').style.display = 'block';
    }

    function nextQuestion() {
        if (currentIndex < rawData.length - 1) {
            loadQuestion(currentIndex + 1);
        } else {
            alert("Bạn đã ở câu hỏi cuối cùng!");
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            loadQuestion(currentIndex - 1);
        } else {
            alert("Đây đã là câu hỏi đầu tiên!");
        }
    }

    function jumpToQuestion() {
        const val = parseInt(document.getElementById('jump-input').value);
        if (isNaN(val) || val < 1 || val > 894) {
            alert("Vui lòng nhập số câu hợp lệ từ 1 đến 894!");
            return;
        }
        const targetIndex = rawData.findIndex(item => item.id === val);
        if (targetIndex !== -1) {
            loadQuestion(targetIndex);
        } else {
            alert("Không tìm thấy số câu này trong hệ thống dữ liệu!");
        }
    }

    function shuffleCurrent() {
        const randomIndex = Math.floor(Math.random() * rawData.length);
        loadQuestion(randomIndex);
    }

    function updateWrongList() {
        const container = document.getElementById('wrong-history');
        document.getElementById('wrong-count').innerText = wrongQuestions.size;
        container.innerHTML = '';
        
        // Sắp xếp lại danh sách câu sai theo thứ tự tăng dần để dễ theo dõi ôn tập
        const sortedWrong = Array.from(wrongQuestions).sort((a, b) => rawData[a].id - rawData[b].id);
        
        sortedWrong.forEach(idx => {
            const span = document.createElement('span');
            span.className = 'wrong-item';
            span.innerText = `Câu ${rawData[idx].id}`;
            span.onclick = () => loadQuestion(idx);
            container.appendChild(span);
        });
    }

    // Khởi chạy ứng dụng với câu hỏi đầu tiên
    loadQuestion(0);
</script>
